[project]
name = "taxipred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin", email = "kevin.bruno.work@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "polyline>=2.0.4",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.53.0",
    "streamlit-folium>=0.26.1",
    "uvicorn>=0.40.0",
]

[project.scripts]
taxipred = "taxipred:main"

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"
